<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчерська Система — Моніторинг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Диспетчерська система енергомережі</span>
            <span id="status" class="badge bg-danger">OFFLINE</span>
        </div>
    </nav>

    <div class="container">
        <!-- Дашборди -->
        <div class="row g-4" id="dashboard">
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted">ЗАГАЛЬНЕ НАВАНТАЖЕННЯ</h6>
                        <h2 id="val-totalLoad" class="display-6 fw-bold">---</h2>
                        <div class="progress mt-3">
                            <div id="bar-totalLoad" class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="text-muted">ЧАСТОТА МЕРЕЖІ</h6>
                        <h2 id="val-frequency" class="display-6 fw-bold">---</h2>
                        <div class="progress mt-3">
                            <div id="bar-frequency" class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-12 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Керування</h5>
                        <div class="d-grid gap-2">
                            <button onclick="switchMode('Economy')" class="btn btn-warning btn-action">Режим Економії</button>
                            <button onclick="switchMode('Emergency')" class="btn btn-danger btn-action">Аварійне Відключення</button>
                        </div>
                        
                        <div id="analytics-section" class="mt-4" style="display: none;">
                            <hr>
                            <button onclick="getAnalytics()" class="btn btn-primary w-100">Звіт Аналітики</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
