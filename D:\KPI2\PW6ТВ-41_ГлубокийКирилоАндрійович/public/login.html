<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід — Енергомережа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; display: flex; align-items: center; height: 100vh; }</style>
</head>
<body>
    <div class="card shadow mx-auto" style="width: 400px; border-top: 5px solid #0057b7;">
        <div class="card-body">
            <h3 class="text-center mb-4">Авторизація</h3>
            <div id="loginArea">
                <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control"></div>
                <div class="mb-3"><label>Пароль</label><input type="password" id="pass" class="form-control"></div>
                <button onclick="login()" class="btn btn-primary w-100">Увійти</button>
                <div class="text-center mt-3"><a href="register.html">Створити аккаунт</a></div>
            </div>
            <div id="2faArea" style="display:none;">
                <div class="alert alert-info">Введіть код 2FA (123456)</div>
                <input type="text" id="code" class="form-control mb-3" placeholder="******">
                <button onclick="verify()" class="btn btn-success w-100">Підтвердити</button>
            </div>
        </div>
    </div>
    <script>
        let currentEmail = '';
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.needs2FA) {
                currentEmail = data.email;
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('2faArea').style.display = 'block';
            } else if (res.ok) {
                localStorage.setItem('role', data.role);
                window.location.href = '/';
            } else { alert(data.error); }
        }
        async function verify() {
            const code = document.getElementById('code').value;
            const res = await fetch('/auth/2fa/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: currentEmail, code })
            });
            if (res.ok) {
                localStorage.setItem('role', 'chief_dispatcher');
                window.location.href = '/';
            } else { alert('Невірний код'); }
        }
    </script>
</body>
</html>
