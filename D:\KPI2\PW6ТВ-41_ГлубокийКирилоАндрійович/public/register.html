<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація Диспетчера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; display: flex; align-items: center; height: 100vh; }</style>
</head>
<body>
    <div class="card shadow mx-auto" style="width: 400px; border-top: 5px solid #0057b7;">
        <div class="card-body">
            <h3 class="text-center mb-4">Реєстрація</h3>
            <div class="mb-3"><label>Електронна пошта</label><input type="email" id="regEmail" class="form-control"></div>
            <div class="mb-3"><label>Пароль</label><input type="password" id="regPass" class="form-control"></div>
            <div class="mb-3">
                <label>Роль диспетчера</label>
                <select id="regRole" class="form-select">
                    <option value="dispatcher_junior">Junior (Моніторинг)</option>
                    <option value="dispatcher_senior">Senior (Керування)</option>
                    <option value="chief_dispatcher">Chief (Повний доступ + 2FA)</option>
                </select>
            </div>
            <button onclick="handleRegister()" class="btn btn-primary w-100">Зареєструватися</button>
            <div class="text-center mt-3"><a href="login.html">Вже є аккаунт? Увійти</a></div>
        </div>
    </div>
    <script>
        async function handleRegister() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password, role })
            });
            if (res.ok) { alert('Реєстрація успішна!'); window.location.href = 'login.html'; }
            else { const d = await res.json(); alert(d.error); }
        }
    </script>
</body>
</html>
